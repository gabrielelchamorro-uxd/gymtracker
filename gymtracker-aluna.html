<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GymTracker</title>
<style>
:root {
  --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#222; --surface3:#2a2a2a;
  --border:#2e2e2e; --accent:#22c55e; --accent-dim:rgba(34,197,94,0.15);
  --text:#f1f5f9; --text2:#94a3b8; --text3:#64748b;
  --danger:#ef4444; --radius:12px; --radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
.topbar-logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.logo-icon{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.badge-treino{display:none;align-items:center;gap:6px;background:var(--accent-dim);border:1px solid var(--accent);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--accent)}
.badge-treino.visible{display:flex}
.badge-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.sync-indicator{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--text3)}
.sync-dot.ok{background:var(--accent)}
.sync-dot.err{background:var(--danger)}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.content::-webkit-scrollbar{width:0}
.page{display:none;padding:16px}
.page.active{display:block}
.bottom-nav{display:flex;border-top:1px solid var(--border);background:var(--bg);flex-shrink:0}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 12px;border:none;background:transparent;color:var(--text3);font-size:10px;font-weight:600;cursor:pointer;transition:color 0.2s;letter-spacing:0.3px}
.bnav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.bnav-btn.active{color:var(--accent)}
.hoje-hero{text-align:center;padding:32px 0 24px}
.hoje-hero-icon{font-size:40px;margin-bottom:12px}
.hoje-hero h2{font-size:22px;font-weight:700;margin-bottom:6px}
.hoje-hero p{color:var(--text2);font-size:14px}
.treino-list{display:flex;flex-direction:column;gap:10px}
.treino-card{display:flex;align-items:center;gap:14px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all 0.15s;text-align:left;width:100%}
.treino-card:active{transform:scale(0.98)}
.treino-card:hover{border-color:var(--accent)}
.treino-badge{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.treino-card-info{flex:1}
.treino-card-name{font-weight:700;font-size:15px;color:var(--text);margin-bottom:3px}
.treino-card-sub{font-size:12px;color:var(--text3)}
.treino-ativo-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.treino-ativo-info{display:flex;align-items:center;gap:10px}
.treino-ativo-name{font-weight:700;font-size:16px}
.treino-ativo-sub{font-size:12px;color:var(--text3);margin-top:2px}
.btn-desistir{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text3);font-size:12px;padding:6px 12px;cursor:pointer;transition:all 0.2s}
.btn-desistir:hover{border-color:var(--danger);color:var(--danger)}
.timer-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 16px 16px;margin-bottom:12px}
.timer-digits{font-family:'Courier New',monospace;font-size:clamp(42px,13vw,62px);font-weight:700;text-align:center;color:var(--text);letter-spacing:2px;line-height:1}
.timer-delta{text-align:center;font-size:12px;color:var(--accent);margin-top:6px;font-weight:600;font-family:'Courier New',monospace;min-height:18px}
.timer-laps{margin-top:10px;display:flex;flex-direction:column;gap:2px;max-height:100px;overflow-y:auto}
.timer-lap-row{font-size:11px;color:var(--text3);font-family:'Courier New',monospace;padding:2px 0}
.timer-btns{display:flex;gap:10px;margin-top:16px}
.btn-pausar{flex:1;padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.15s;font-family:inherit}
.btn-marcar{flex:2;padding:12px;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#000;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.15s;font-family:inherit}
.btn-pausar:active,.btn-marcar:active{transform:scale(0.97)}
.descanso-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;display:none}
.descanso-block.visible{display:block}
.descanso-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.descanso-timer{font-family:'Courier New',monospace;font-size:24px;font-weight:700;color:var(--accent);transition:color 0.3s}
.descanso-timer.urgent{color:var(--danger)}
.descanso-opts{display:flex;align-items:center;gap:8px}
.descanso-opt{padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;font-family:inherit}
.descanso-opt.active{background:var(--accent);border-color:var(--accent);color:#000}
.descanso-pular{font-size:11px;color:var(--text3);background:transparent;border:none;cursor:pointer;text-decoration:underline;padding:0;font-family:inherit}
.descanso-bar-track{width:100%;height:3px;background:var(--surface3);border-radius:2px;overflow:hidden}
.descanso-bar-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 1s linear,background 0.3s}
.descanso-bar-fill.urgent{background:var(--danger)}
.ex-list{display:flex;flex-direction:column;gap:10px}
.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color 0.2s}
.ex-card.concluido{border-color:var(--accent);opacity:0.75}
.ex-header{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.ex-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all 0.2s}
.ex-check.on{background:var(--accent);border-color:var(--accent);color:#000}
.ex-title{flex:1}
.ex-name{font-weight:700;font-size:14px}
.ex-meta{font-size:12px;color:var(--text3);margin-top:2px}
.ex-carga-prev{font-size:11px;color:var(--accent);font-weight:600;background:var(--accent-dim);padding:2px 8px;border-radius:10px;white-space:nowrap}
.ex-body{display:none;padding:0 16px 14px;border-top:1px solid var(--border)}
.ex-body.open{display:block}
.series-chips{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.serie-chip{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:12px;font-weight:700;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;font-family:inherit;flex-shrink:0}
.serie-chip.on{background:var(--accent);border-color:var(--accent);color:#000}
.series-rows{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.serie-row{display:flex;align-items:center;gap:10px}
.serie-input{flex:1;min-width:0}
.ex-inputs{display:flex;gap:10px}
.ex-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;padding:9px 12px;outline:none;transition:border-color 0.2s;font-family:inherit}
.ex-input:focus{border-color:var(--accent)}
.ex-input::placeholder{color:var(--text3)}
.config-section{margin-bottom:20px}
.config-section-title{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--text3);margin-bottom:10px;text-transform:uppercase}
.novo-treino-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.novo-treino-card input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;padding:9px 12px;outline:none;transition:border-color 0.2s;font-family:inherit}
.novo-treino-card input:focus{border-color:var(--accent)}
.input-letra{width:70px;text-transform:uppercase;font-weight:700;text-align:center}
.input-nome-treino{flex:1;min-width:120px}
.btn-add-treino{width:36px;height:36px;border-radius:8px;border:none;background:var(--accent);color:#000;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.config-treino-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.config-treino-header{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer}
.config-treino-header .chevron{color:var(--text3);transition:transform 0.2s;font-size:14px}
.config-treino-header.open .chevron{transform:rotate(180deg)}
.config-treino-body{display:none;border-top:1px solid var(--border)}
.config-treino-body.open{display:block}
.config-ex-header{display:flex;gap:6px;padding:10px 16px 4px;font-size:10px;color:var(--text3);font-weight:600;letter-spacing:1px}
.config-ex-row{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border)}
.drag-handle{color:var(--text3);font-size:16px;cursor:grab;padding:0 2px}
.config-ex-row input{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;padding:6px 8px;outline:none;transition:border-color 0.2s;font-family:inherit}
.config-ex-row input:focus{border-color:var(--accent)}
.input-ex-nome{flex:1}
.input-ex-num{width:44px;text-align:center}
.btn-del-ex{background:transparent;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:4px;transition:color 0.2s}
.btn-del-ex:hover{color:var(--danger)}
.btn-add-ex{width:100%;padding:10px;background:transparent;border:none;border-top:1px solid var(--border);color:var(--text3);font-size:13px;cursor:pointer;transition:color 0.2s;font-family:inherit}
.btn-add-ex:hover{color:var(--accent)}
.config-treino-name-input{background:transparent;border:none;color:var(--text);font-size:15px;font-weight:700;outline:none;flex:1;font-family:inherit}
.btn-del-treino{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text3);font-size:13px;padding:5px 8px;cursor:pointer;transition:all 0.2s;margin-left:auto;font-family:inherit}
.btn-del-treino:hover{border-color:var(--danger);color:var(--danger)}
.hist-filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.hist-chip{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;font-family:inherit}
.hist-chip.active{background:var(--accent);border-color:var(--accent);color:#000}
.hist-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.hist-card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer}
.hist-card-left{display:flex;align-items:center;gap:10px}
.hist-badge{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.hist-info-name{font-weight:700;font-size:14px}
.hist-info-sub{font-size:12px;color:var(--text3);margin-top:2px}
.hist-duration{font-family:'Courier New',monospace;font-size:13px;color:var(--text2)}
.hist-body{display:none;border-top:1px solid var(--border);padding:14px 16px}
.hist-body.open{display:block}
.hist-ex-row{padding:8px 0;border-bottom:1px solid var(--border)}
.hist-ex-row:last-of-type{border-bottom:none}
.hist-ex-name{font-size:13px;font-weight:600}
.hist-ex-detail{font-size:12px;color:var(--text3);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hist-carga{color:var(--accent);font-weight:600}
.hist-btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.btn-chart{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:12px;cursor:pointer;transition:all 0.2s;font-family:inherit}
.btn-chart:hover{border-color:var(--accent);color:var(--accent)}
.btn-del-hist{margin-left:auto;padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:12px;cursor:pointer;transition:all 0.2s;font-family:inherit}
.btn-del-hist:hover{border-color:var(--danger);color:var(--danger)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text3);text-align:center;gap:10px}
.empty-state svg{width:48px;height:48px;stroke:var(--text3);fill:none;stroke-width:1.5;margin-bottom:4px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:24px 20px 32px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;animation:slideUp 0.25s ease}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px}
.modal-title{font-size:18px;font-weight:700;margin-bottom:6px}
.modal-sub{font-size:13px;color:var(--text3);margin-bottom:20px}
.modal-stat{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px}
.modal-stat-val{font-weight:700;font-family:'Courier New',monospace;color:var(--accent)}
.modal-btns{display:flex;gap:10px;margin-top:20px}
.modal-btns button{flex:1;padding:13px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;transition:all 0.15s;border:none;font-family:inherit}
.modal-btn-cancel{background:var(--surface2);color:var(--text);border:1px solid var(--border)!important}
.modal-btn-save{background:var(--accent);color:#000}
.chart-wrap{width:100%;height:180px;background:var(--surface2);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:14px}
.chart-wrap canvas{display:block}
.chart-table{width:100%;border-collapse:collapse;font-size:12px}
.chart-table th{color:var(--text3);font-size:10px;letter-spacing:1px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
.chart-table td{padding:8px;border-bottom:1px solid var(--border);font-family:'Courier New',monospace;font-size:11px}
.chart-table tr:last-child td{border-bottom:none}
.td-kg{color:var(--accent);font-weight:700}
#inactivity-toast{display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--danger);border-radius:var(--radius);padding:14px 18px;z-index:300;text-align:center;width:calc(100% - 32px);max-width:440px;box-shadow:0 0 24px rgba(239,68,68,0.25)}
#inactivity-toast.show{display:block;animation:slideUp 0.2s ease}
#inactivity-toast p{font-size:12px;color:var(--text3);margin-bottom:8px}
#inactivity-toast strong{color:var(--text);font-family:'Courier New',monospace}
#inactivity-toast button{background:var(--accent);border:none;border-radius:6px;padding:8px 20px;color:#000;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--text3);gap:10px;font-size:14px}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">
    <div class="logo-icon">🏋️</div>
    GymTracker
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="sync-indicator" id="syncInd">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncTxt">conectando</span>
    </div>
    <div class="badge-treino" id="badgeTreino">
      <div class="badge-dot"></div>Em treino
    </div>
  </div>
</div>

<div class="content" id="mainContent">
  <!-- HOJE -->
  <div class="page active" id="page-hoje">
    <div id="hoje-selecao">
      <div class="hoje-hero">
        <div class="hoje-hero-icon">🏋️</div>
        <h2>Iniciar Treino</h2>
        <p>Selecione o treino de hoje</p>
      </div>
      <div class="treino-list" id="treinoList"><div class="loading"><div class="spinner"></div>Carregando...</div></div>
    </div>
    <div id="hoje-ativo" style="display:none">
      <div class="treino-ativo-header">
        <div class="treino-ativo-info">
          <div class="treino-badge" id="ativoBadge"></div>
          <div>
            <div class="treino-ativo-name" id="ativoNome">—</div>
            <div class="treino-ativo-sub" id="ativoSub">—</div>
          </div>
        </div>
        <button class="btn-desistir" onclick="desistir()">↩ Desistir</button>
      </div>
      <div class="timer-block">
        <div class="timer-digits" id="timerDigits">00:00:00</div>
        <div class="timer-delta" id="timerDelta"></div>
        <div class="timer-laps" id="timerLaps"></div>
        <div class="timer-btns">
          <button class="btn-pausar" id="btnPausar" onclick="togglePause()">
            <span id="pauseIcon">⏸</span><span id="pauseLabel">Pausar</span>
          </button>
          <button class="btn-marcar" onclick="marcarSerie()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="6 3 20 12 6 21 6 3"/></svg>
            Marcar Série
          </button>
        </div>
      </div>
      <div class="descanso-block" id="descansoBlock">
        <div class="descanso-top">
          <div class="descanso-timer" id="descansoTimer">1:00</div>
          <div class="descanso-opts">
            <button class="descanso-opt active" id="dOpt60" onclick="setDescanso(60)">1 min</button>
            <button class="descanso-opt" id="dOpt90" onclick="setDescanso(90)">1:30</button>
            <button class="descanso-opt" id="dOpt120" onclick="setDescanso(120)">2 min</button>
            <button class="descanso-pular" onclick="pularDescanso()">✕ pular</button>
          </div>
        </div>
        <div class="descanso-bar-track"><div class="descanso-bar-fill" id="descansoFill"></div></div>
      </div>
      <div class="ex-list" id="exList"></div>
      <button onclick="abrirModalFim()" style="width:100%;padding:14px;margin-top:8px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
        🏁 Finalizar Treino
      </button>
    </div>
  </div>

  <!-- TREINOS -->
  <div class="page" id="page-treinos">
    <div class="config-section">
      <div class="config-section-title">Novo Treino</div>
      <div class="novo-treino-card">
        <input id="inputLetra" class="input-letra" maxlength="2" placeholder="LETRA" oninput="this.value=this.value.toUpperCase()">
        <input id="inputNomeTreino" class="input-nome-treino" placeholder="Nome do treino">
        <button class="btn-add-treino" onclick="addTreino()">+</button>
      </div>
    </div>
    <div class="config-section">
      <div class="config-section-title">Seus Treinos</div>
      <div id="configTreinoList"><div class="loading"><div class="spinner"></div>Carregando...</div></div>
    </div>
  </div>

  <!-- HISTÓRICO -->
  <div class="page" id="page-hist">
    <div class="hist-filter" id="histFilter"></div>
    <div id="histList"></div>
  </div>
</div>

<div class="bottom-nav">
  <button class="bnav-btn active" id="bnav-hoje" onclick="goPage('hoje')">

<script>

const SB_URL = 'https://jpauuwaxqyxydlbylrir.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpwYXV1d2F4cXl4eWRsYnlscmlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMzU5NDMsImV4cCI6MjEwMjgxMTk0M30._H716vtYIE97G31vOETMHRMmAOvx9_BNX9EPZFjHCPM';

async function sbFetch(path, opts={}) {
  const headers = {
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + SB_KEY,
    'Content-Type': 'application/json',
    ...(opts.headers||{})
  };
  if (opts.method && ['POST','PATCH'].includes(opts.method)) {
    headers['Prefer'] = opts.prefer || 'return=representation';
  }
  const res = await fetch(SB_URL + '/rest/v1/' + path, { ...opts, headers });
  if (!res.ok) {
    const e = await res.text();
    console.error('sbFetch error', res.status, e);
    throw new Error(res.status + ': ' + e);
  }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

function setSyncStatus(state) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncTxt');
  if (state === 'ok')  { dot.className='sync-dot ok';  txt.textContent='sincronizado'; }
  if (state === 'err') { dot.className='sync-dot err'; txt.textContent='sem conexão'; }
  if (state === 'loading') { dot.className='sync-dot'; txt.textContent='sincronizando'; }
}

// ── PALETA ───────────────────────────────────────────────────────────────────
const PALETTE = [
  {bg:'#166534',color:'#4ade80'},{bg:'#1e3a5f',color:'#60a5fa'},
  {bg:'#7c2d12',color:'#fb923c'},{bg:'#4a1d96',color:'#c084fc'},
  {bg:'#831843',color:'#f472b6'},{bg:'#134e4a',color:'#2dd4bf'},
  {bg:'#713f12',color:'#fbbf24'},{bg:'#1e1b4b',color:'#818cf8'},
];
function getColor(k) {
  const keys = Object.keys(treinos);
  return PALETTE[keys.indexOf(k) % PALETTE.length] || PALETTE[0];
}

// ── COMPAT: carga única → cargas por série ───────────────────────────────────
function normalizarCargas(ex) {
  const n = (ex.series && ex.series>0) ? ex.series : (Array.isArray(ex.cargas)?ex.cargas.length:1);
  if (Array.isArray(ex.cargas)) {
    const cargas = ex.cargas.slice(0,n); while(cargas.length<n) cargas.push('');
    const concluidas = Array.isArray(ex.concluidas) ? ex.concluidas.slice(0,n) : cargas.map(v=>!!v && parseFloat(v)>0);
    while(concluidas.length<n) concluidas.push(false);
    return { cargas, concluidas };
  }
  if (ex.carga!==undefined && ex.carga!==null && ex.carga!=='') {
    const v = parseFloat(ex.carga)||0;
    return { cargas: Array(n).fill(v), concluidas: Array(n).fill(!!ex.done) };
  }
  return { cargas: Array(n).fill(''), concluidas: Array(n).fill(false) };
}
function maxCarga(cargas) {
  const nums = cargas.map(v=>parseFloat(v)).filter(v=>!isNaN(v)&&v>0);
  return nums.length ? Math.max(...nums) : null;
}

// ── STATE ────────────────────────────────────────────────────────────────────
let treinos   = {};
let historico = [];

let sessao = {
  key:null, ativo:false, pausado:false,
  segundos:0, laps:[], ultimoLap:0, exercicios:{}
};
let timerIv=null, timerStart=null, timerAccum=0;

// ── SUPABASE: CARREGAR ───────────────────────────────────────────────────────
async function carregarTreinos() {
  try {
    setSyncStatus('loading');
    const rows = await sbFetch('treinos?order=letra');
    treinos = {};
    (rows||[]).forEach(r => { treinos[r.letra] = { id: r.id, nome: r.nome, exercicios: r.exercicios }; });
    setSyncStatus('ok');
    localStorage.setItem('gt_treinos', JSON.stringify(treinos));
  } catch(e) {
    console.error('carregarTreinos:', e.message);
    setSyncStatus('err');
    document.getElementById('syncTxt').title = e.message;
    const local = localStorage.getItem('gt_treinos');
    if (local) treinos = JSON.parse(local);
  }
  renderSelecao();
  if (paginaAtual === 'treinos') renderConfigTreinos();
}

async function carregarHistorico() {
  try {
    const rows = await sbFetch('historico?order=created_at.desc');
    historico = (rows||[]).map(r => ({
      id: r.id, data: r.data, treino: r.treino, nomeT: r.nome_t,
      duracao: r.duracao, laps: r.laps, exercicios: r.exercicios
    }));
  } catch(e) {
    const local = localStorage.getItem('gt_historico');
    if (local) historico = JSON.parse(local);
  }
}

async function saveTreino(k) {
  const t = treinos[k];
  setSyncStatus('loading');
  try {
    if (t.id) {
      await sbFetch(`treinos?id=eq.${t.id}`, {
        method:'PATCH', prefer:'return=minimal',
        body: JSON.stringify({ nome: t.nome, exercicios: t.exercicios })
      });
    } else {
      const rows = await sbFetch('treinos', {
        method:'POST',
        body: JSON.stringify({ letra: k, nome: t.nome, exercicios: t.exercicios })
      });
      if (rows?.[0]) treinos[k].id = rows[0].id;
    }
    setSyncStatus('ok');
    localStorage.setItem('gt_treinos', JSON.stringify(treinos));
  } catch(e) { setSyncStatus('err'); }
}

async function deleteTreinoRemote(k) {
  const t = treinos[k];
  if (!t?.id) return;
  try { await sbFetch(`treinos?id=eq.${t.id}`, { method:'DELETE', prefer:'return=minimal' }); } catch(e) {}
}

async function salvarHistoricoRemoto(registro) {
  setSyncStatus('loading');
  try {
    const rows = await sbFetch('historico', {
      method:'POST',
      body: JSON.stringify({
        data: registro.data, treino: registro.treino, nome_t: registro.nomeT,
        duracao: registro.duracao, laps: registro.laps, exercicios: registro.exercicios
      })
    });
    if (rows?.[0]) registro.id = rows[0].id;
    setSyncStatus('ok');
    localStorage.setItem('gt_historico', JSON.stringify(historico));
  } catch(e) { setSyncStatus('err'); }
}

async function deletarHistoricoRemoto(id) {
  if (!id) return;
  try { await sbFetch(`historico?id=eq.${id}`, { method:'DELETE', prefer:'return=minimal' }); } catch(e) {}
}

// ── NAVEGAÇÃO ────────────────────────────────────────────────────────────────
let paginaAtual = 'hoje';
function goPage(p) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.querySelectorAll('.bnav-btn').forEach((b,i) => b.classList.toggle('active', ['hoje','treinos','hist'][i]===p));
  paginaAtual = p;
  if (p==='treinos') renderConfigTreinos();
  if (p==='hist') { carregarHistorico().then(renderHistorico); }
}

// ── TIMER ────────────────────────────────────────────────────────────────────
function fmt(s) { return [Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(v=>String(v).padStart(2,'0')).join(':'); }
function timerStart_() { timerStart=Date.now(); timerIv=setInterval(tickTimer,500); }
function timerPause_() { clearInterval(timerIv);timerIv=null;timerAccum=sessao.segundos;timerStart=null; }
function tickTimer() {
  if (!sessao.ativo||sessao.pausado) return;
  sessao.segundos = timerAccum + Math.floor((Date.now()-timerStart)/1000);
  const el = document.getElementById('timerDigits');
  if (el) el.textContent = fmt(sessao.segundos);
}

// ── CARGA ANTERIOR ───────────────────────────────────────────────────────────
function cargaAnterior(treinoKey, nomeEx) {
  for (const h of historico) {
    if (h.treino !== treinoKey) continue;
    const ex = h.exercicios.find(e => e.nome===nomeEx);
    if (ex) { const {cargas}=normalizarCargas(ex); const m=maxCarga(cargas); if(m!==null) return m; }
  }
  return null;
}

// ── SELECAO ──────────────────────────────────────────────────────────────────
function renderSelecao() {
  const list = document.getElementById('treinoList');
  const keys = Object.keys(treinos);
  if (!keys.length) {
    list.innerHTML = `<div style="text-align:center;color:var(--text3);padding:40px;font-size:14px">Nenhum treino cadastrado.<br>Vá em Treinos para adicionar.</div>`;
    return;
  }
  list.innerHTML = keys.map(k => {
    const c = getColor(k);
    return `<button class="treino-card" onclick="iniciarTreino('${k}')">
      <div class="treino-badge" style="background:${c.bg};color:${c.color}">${k}</div>
      <div class="treino-card-info">
        <div class="treino-card-name">${treinos[k].nome}</div>
        <div class="treino-card-sub">${treinos[k].exercicios.length} exercício${treinos[k].exercicios.length!==1?'s':''}</div>
      </div>
      <span style="color:var(--text3);font-size:18px">›</span>
    </button>`;
  }).join('');
}

function iniciarTreino(k) {
  sessao = { key:k, ativo:true, pausado:false, segundos:0, laps:[], ultimoLap:0, exercicios:{} };
  timerAccum = 0;
  treinos[k].exercicios.forEach((ex,i) => { sessao.exercicios[i]={done:false,seriesDone:[],cargas:Array(ex.series||1).fill(''),obs:''}; });
  const c = getColor(k);
  document.getElementById('ativoBadge').style.background=c.bg;
  document.getElementById('ativoBadge').style.color=c.color;
  document.getElementById('ativoBadge').textContent=k;
  document.getElementById('ativoNome').textContent=treinos[k].nome;
  document.getElementById('ativoSub').textContent=treinos[k].exercicios.length+' exercícios';
  document.getElementById('hoje-selecao').style.display='none';
  document.getElementById('hoje-ativo').style.display='block';
  document.getElementById('badgeTreino').classList.add('visible');
  renderExercicios();
  timerStart_();
  resetInatividade();
}

// ── EXERCÍCIOS ───────────────────────────────────────────────────────────────
function renderExercicios() {
  const k=sessao.key, exs=treinos[k].exercicios;
  document.getElementById('exList').innerHTML = exs.map((ex,i) => {
    const st=sessao.exercicios[i];
    if(!Array.isArray(st.cargas)) st.cargas=Array(ex.series||1).fill('');
    const prev=cargaAnterior(k,ex.nome);
    const serieRows=Array.from({length:ex.series},(_,s)=>{
      const done=st.seriesDone.includes(s);
      const val=st.cargas[s]!==undefined&&st.cargas[s]!==null?st.cargas[s]:'';
      return `<div class="serie-row">
        <button class="serie-chip ${done?'on':''}" onclick="toggleSerie(${i},${s})">S${s+1}</button>
        <input class="ex-input serie-input" type="number" placeholder="kg" value="${val}" onchange="setCargaSerie(${i},${s},this.value)" min="0" step="0.5">
      </div>`;
    }).join('');
    return `<div class="ex-card ${st.done?'concluido':''}" id="excard-${i}">
      <div class="ex-header" onclick="toggleExBody(${i})">
        <button class="ex-check ${st.done?'on':''}" onclick="event.stopPropagation();toggleExDone(${i})">${st.done?'✓':''}</button>
        <div class="ex-title">
          <div class="ex-name">${ex.nome}</div>
          <div class="ex-meta">${ex.series} × ${ex.reps}</div>
        </div>
        ${prev!==null?`<div class="ex-carga-prev">${prev}kg</div>`:''}
      </div>
      <div class="ex-body" id="exbody-${i}">
        ${ex.instrucoes?`<div style="margin:10px 0 4px;padding:8px 10px;background:var(--surface2);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;font-size:12px;color:var(--text2);line-height:1.5">${ex.instrucoes}</div>`:''}
        <div class="series-rows">${serieRows}</div>
        <div class="ex-inputs">
          <input class="ex-input" placeholder="Observação..." value="${st.obs}" onchange="sessao.exercicios[${i}].obs=this.value" style="width:100%">
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleExBody(i) { document.getElementById(`exbody-${i}`).classList.toggle('open'); }
function toggleSerie(i,s) {
  const sd=sessao.exercicios[i].seriesDone, p=sd.indexOf(s);
  if(p===-1) sd.push(s); else sd.splice(p,1);
  renderExercicios(); document.getElementById(`exbody-${i}`).classList.add('open'); resetInatividade();
}
function toggleExDone(i) { sessao.exercicios[i].done=!sessao.exercicios[i].done; renderExercicios(); }
function setCargaSerie(i,s,val) {
  if(!Array.isArray(sessao.exercicios[i].cargas)) sessao.exercicios[i].cargas=[];
  sessao.exercicios[i].cargas[s]=val;
  resetInatividade();
}

// ── MARCAR / DESCANSO ────────────────────────────────────────────────────────
function marcarSerie() {
  const delta=sessao.segundos-sessao.ultimoLap;
  sessao.laps.push({total:sessao.segundos,delta}); sessao.ultimoLap=sessao.segundos;
  renderLaps(); iniciarDescanso(descansoTotal); resetInatividade();
}
function renderLaps() {
  const dl=document.getElementById('timerDelta'), ll=document.getElementById('timerLaps');
  const n=sessao.laps.length;
  if(!n){dl.textContent='';ll.innerHTML='';return;}
  dl.textContent=`Δ desde última série: ${fmt(sessao.laps[n-1].delta)}`;
  ll.innerHTML=sessao.laps.map((l,i)=>`<div class="timer-lap-row">#${i+1} — ${fmt(l.total)} (Δ ${fmt(l.delta)})</div>`).reverse().slice(0,5).join('');
}
let descansoIv=null,descansoTotal=60,descansoRest=0;
function iniciarDescanso(sec) {
  clearInterval(descansoIv); descansoTotal=sec; descansoRest=sec;
  document.getElementById('descansoBlock').classList.add('visible');
  [60,90,120].forEach(s=>document.getElementById('dOpt'+s).classList.toggle('active',s===sec));
  atualizarDescanso();
  descansoIv=setInterval(()=>{descansoRest--;atualizarDescanso();if(descansoRest<=0){clearInterval(descansoIv);if(navigator.vibrate)navigator.vibrate([200,100,200]);}},1000);
}
function setDescanso(sec){descansoTotal=sec;iniciarDescanso(sec);}
function pularDescanso(){clearInterval(descansoIv);document.getElementById('descansoBlock').classList.remove('visible');}
function atualizarDescanso() {
  const pct=Math.max(0,descansoRest/descansoTotal*100),urgent=descansoRest<=10&&descansoRest>0,done=descansoRest<=0;
  const m=Math.floor(descansoRest/60),s=String(descansoRest%60).padStart(2,'0');
  const dt=document.getElementById('descansoTimer'),df=document.getElementById('descansoFill');
  dt.textContent=done?'✓ Pronto':`${m}:${s}`;
  dt.className='descanso-timer'+(urgent?' urgent':done?' done':'');
  df.style.width=pct+'%'; df.className='descanso-bar-fill'+(urgent?' urgent':'');
}

// ── PAUSAR ───────────────────────────────────────────────────────────────────
function togglePause() {
  if(!sessao.ativo) return;
  if(!sessao.pausado) {
    timerPause_(); sessao.pausado=true;
    document.getElementById('pauseIcon').textContent='▶';
    document.getElementById('pauseLabel').textContent='Retomar';
    clearInatividade();
  } else {
    timerStart_(); sessao.pausado=false;
    document.getElementById('pauseIcon').textContent='⏸';
    document.getElementById('pauseLabel').textContent='Pausar';
    resetInatividade();
  }
}

// ── DESISTIR / FINALIZAR ─────────────────────────────────────────────────────
function desistir() {
  if(!confirm('Desistir? O progresso não será salvo.')) return;
  encerrarSessao();
}
function abrirModalFim() {
  if(!sessao.ativo) return;
  clearInterval(timerIv);
  const exs=treinos[sessao.key].exercicios, doneCnt=Object.values(sessao.exercicios).filter(e=>e.done).length;
  document.getElementById('modalFimSub').textContent=treinos[sessao.key].nome;
  document.getElementById('modalFimStats').innerHTML=`
    <div class="modal-stat"><span>Duração</span><span class="modal-stat-val">${fmt(sessao.segundos)}</span></div>
    <div class="modal-stat"><span>Exercícios</span><span class="modal-stat-val">${doneCnt}/${exs.length}</span></div>
    <div class="modal-stat"><span>Séries marcadas</span><span class="modal-stat-val">${sessao.laps.length}</span></div>`;
  document.getElementById('modalFim').classList.add('open');
}
function cancelarFim() { document.getElementById('modalFim').classList.remove('open'); timerStart_(); resetInatividade(); }
function salvarTreino() { document.getElementById('modalFim').classList.remove('open'); _salvar(); encerrarSessao(); }
async function _salvar() {
  const exs=treinos[sessao.key].exercicios;
  const registro = {
    data: new Date().toLocaleDateString('pt-BR'),
    treino: sessao.key, nomeT: treinos[sessao.key].nome,
    duracao: sessao.segundos, laps: sessao.laps,
    exercicios: exs.map((ex,i)=>{
      const st=sessao.exercicios[i]||{};
      const cargas=(Array.isArray(st.cargas)?st.cargas:[]).slice(0,ex.series);
      while(cargas.length<ex.series) cargas.push('');
      const concluidas=Array.from({length:ex.series},(_,s)=>(st.seriesDone||[]).includes(s));
      return {
        nome:ex.nome, series:ex.series, reps:ex.reps,
        done:st.done||false,
        cargas, concluidas,
        obs:st.obs||''
      };
    })
  };
  historico.unshift(registro);
  await salvarHistoricoRemoto(registro);
}
function encerrarSessao() {
  clearInterval(timerIv);timerIv=null; clearInterval(descansoIv); clearInatividade();
  sessao.ativo=false;
  document.getElementById('badgeTreino').classList.remove('visible');
  document.getElementById('hoje-ativo').style.display='none';
  document.getElementById('hoje-selecao').style.display='block';
  document.getElementById('timerDigits').textContent='00:00:00';
  document.getElementById('timerDelta').textContent='';
  document.getElementById('timerLaps').innerHTML='';
  document.getElementById('descansoBlock').classList.remove('visible');
  document.getElementById('pauseIcon').textContent='⏸';
  document.getElementById('pauseLabel').textContent='Pausar';
}

// ── INATIVIDADE ──────────────────────────────────────────────────────────────
const INACT_LIMIT=60*60, INACT_WARN=60;
let inactTimer=null,inactWarnTimer=null,inactCountIv=null,inactCount=0;
function resetInatividade() {
  if(!sessao.ativo||sessao.pausado) return;
  clearTimeout(inactTimer);clearTimeout(inactWarnTimer);clearInterval(inactCountIv);esconderToast();
  inactWarnTimer=setTimeout(()=>{
    if(!sessao.ativo) return;
    inactCount=INACT_WARN; mostrarToast();
    inactCountIv=setInterval(()=>{
      inactCount--;
      const el=document.getElementById('inactCountdown');
      if(el) el.textContent=inactCount;
      if(inactCount<=0){clearInterval(inactCountIv);esconderToast();_salvar();encerrarSessao();}
    },1000);
  },(INACT_LIMIT-INACT_WARN)*1000);
  inactTimer=setTimeout(()=>{clearInterval(inactCountIv);esconderToast();if(sessao.ativo){_salvar();encerrarSessao();}},INACT_LIMIT*1000);
}
function cancelarAutoFim(){clearTimeout(inactTimer);clearTimeout(inactWarnTimer);clearInterval(inactCountIv);esconderToast();resetInatividade();}
function clearInatividade(){clearTimeout(inactTimer);clearTimeout(inactWarnTimer);clearInterval(inactCountIv);esconderToast();}
function mostrarToast(){document.getElementById('inactivity-toast').classList.add('show');}
function esconderToast(){document.getElementById('inactivity-toast').classList.remove('show');}
['click','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(sessao.ativo&&!sessao.pausado)resetInatividade();},{passive:true}));

// ── CONFIG TREINOS ───────────────────────────────────────────────────────────
function renderConfigTreinos() {
  const el=document.getElementById('configTreinoList');
  const keys=Object.keys(treinos);
  if(!keys.length){el.innerHTML=`<div style="text-align:center;color:var(--text3);padding:30px;font-size:14px">Nenhum treino ainda.</div>`;return;}
  el.innerHTML=keys.map(k=>{
    const t=treinos[k],c=getColor(k);
    return `<div class="config-treino-block">
      <div class="config-treino-header open" id="cth-${k}" onclick="toggleConfigBlock('${k}')">
        <span class="chevron">▾</span>
        <div class="treino-badge" style="background:${c.bg};color:${c.color};width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0">${k}</div>
        <input class="config-treino-name-input" value="${t.nome}" onclick="event.stopPropagation()" onchange="treinos['${k}'].nome=this.value;saveTreino('${k}')">
        ${keys.length>1?`<button class="btn-del-treino" onclick="event.stopPropagation();deleteTreino('${k}')">🗑</button>`:''}
      </div>
      <div class="config-treino-body open" id="ctb-${k}">
        <div class="config-ex-header">
          <span style="width:20px"></span><span style="flex:1">EXERCÍCIO</span>
          <span style="width:44px;text-align:center">SÉR</span>
          <span style="width:10px;margin:0 4px">×</span>
          <span style="width:44px;text-align:center">REPS</span>
          <span style="width:28px"></span>
        </div>
        ${t.exercicios.map((ex,i)=>`
        <div id="cer-${k}-${i}">
          <div class="config-ex-row">
            <span class="drag-handle">⋮⋮</span>
            <input class="input-ex-nome" value="${ex.nome}" onchange="treinos['${k}'].exercicios[${i}].nome=this.value;saveTreino('${k}')">
            <input class="input-ex-num" type="number" min="1" value="${ex.series}" onchange="treinos['${k}'].exercicios[${i}].series=+this.value;saveTreino('${k}')">
            <span style="color:var(--text3);font-size:13px">×</span>
            <input class="input-ex-num" type="number" min="1" value="${ex.reps}" onchange="treinos['${k}'].exercicios[${i}].reps=+this.value;saveTreino('${k}')">
            <button class="btn-del-ex" onclick="deleteEx('${k}',${i})">🗑</button>
          </div>
          <div style="padding:0 16px 10px;border-bottom:1px solid var(--border)">
            <input style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;padding:7px 10px;outline:none;font-family:inherit;transition:border-color 0.2s" placeholder="Instruções / observações (opcional)" value="${ex.instrucoes||''}"
              onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'"
              onchange="treinos['${k}'].exercicios[${i}].instrucoes=this.value;saveTreino('${k}')">
          </div>
        </div>`).join('')}
        <button class="btn-add-ex" onclick="addEx('${k}')">+ Adicionar exercício</button>
      </div>
    </div>`;
  }).join('');
}

function toggleConfigBlock(k) {
  document.getElementById('cth-'+k).classList.toggle('open');
  document.getElementById('ctb-'+k).classList.toggle('open');
}
async function addTreino() {
  const k=document.getElementById('inputLetra').value.toUpperCase().trim();
  const nome=document.getElementById('inputNomeTreino').value.trim();
  if(!k){alert('Informe a letra.');return;}
  if(treinos[k]){alert(`Treino ${k} já existe.`);return;}
  treinos[k]={nome:nome||`Treino ${k}`,exercicios:[{nome:'Novo exercício',series:3,reps:12}]};
  document.getElementById('inputLetra').value=''; document.getElementById('inputNomeTreino').value='';
  await saveTreino(k);
  renderConfigTreinos(); renderSelecao();
}
async function deleteTreino(k) {
  if(!confirm(`Remover Treino ${k}?`)) return;
  await deleteTreinoRemote(k);
  delete treinos[k]; renderConfigTreinos(); renderSelecao();
}
function addEx(k) { treinos[k].exercicios.push({nome:'Novo exercício',series:3,reps:12}); saveTreino(k); renderConfigTreinos(); }
function deleteEx(k,i) { treinos[k].exercicios.splice(i,1); saveTreino(k); renderConfigTreinos(); }

// ── HISTÓRICO ────────────────────────────────────────────────────────────────
let histFiltro='TODOS';
function renderHistorico() {
  const el=document.getElementById('histList'), fEl=document.getElementById('histFilter');
  if(!historico.length){
    fEl.innerHTML='';
    el.innerHTML=`<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 9l-5-5-4 4-3-3"/></svg><p>Nenhum treino registrado.</p><span>Complete um treino para ver aqui.</span></div>`;
    return;
  }
  const keys=['TODOS',...new Set(historico.map(h=>h.treino))];
  fEl.innerHTML=keys.map(k=>`<button class="hist-chip ${histFiltro===k?'active':''}" onclick="setHistFiltro('${k}')">${k==='TODOS'?'Todos':'Treino '+k}</button>`).join('');
  const lista=histFiltro==='TODOS'?historico:historico.filter(h=>h.treino===histFiltro);
  if(!lista.length){el.innerHTML=`<div class="empty-state"><p>Sem registros para este treino.</p></div>`;return;}
  el.innerHTML=lista.map(h=>{
    const idx=historico.indexOf(h), c=getColor(h.treino);
    const comCarga=h.exercicios.filter(e=>{const {cargas}=normalizarCargas(e);return maxCarga(cargas)!==null;});
    return `<div class="hist-card">
      <div class="hist-card-header" onclick="toggleHistBody(${idx})">
        <div class="hist-card-left">
          <div class="hist-badge" style="background:${c.bg};color:${c.color}">${h.treino}</div>
          <div><div class="hist-info-name">${h.nomeT||'Treino '+h.treino}</div><div class="hist-info-sub">${h.data}</div></div>
        </div>
        <div class="hist-duration">${fmt(h.duracao)}</div>
      </div>
      <div class="hist-body" id="hbody-${idx}">
        ${h.exercicios.map(ex=>{
          const {cargas}=normalizarCargas(ex);
          const curMax=maxCarga(cargas), prevMax=encontrarCargaAnterior(h,ex.nome);
          let dHtml='';
          if(curMax!==null&&prevMax!==null){const d=curMax-prevMax;if(d>0)dHtml=`<span style="color:#22c55e;font-size:11px">▲${d}kg</span>`;else if(d<0)dHtml=`<span style="color:var(--danger);font-size:11px">▼${Math.abs(d)}kg</span>`;}
          const cargasHtml=cargas.map((v,s)=>(v!==''&&v!==null&&v!==undefined&&parseFloat(v)>0)?`<span class="hist-carga">S${s+1}: ${v}kg</span>`:'').join(' ');
          return `<div class="hist-ex-row">
            <div class="hist-ex-name">${ex.done?'✓ ':''}${ex.nome}</div>
            <div class="hist-ex-detail">${cargasHtml} ${dHtml} ${ex.obs?`<span>${ex.obs}</span>`:''}</div>
          </div>`;
        }).join('')}
        <div class="hist-btn-row">
          ${comCarga.map(ex=>`<button class="btn-chart" onclick="abrirChart('${esc(ex.nome)}','${h.treino}')">📈 ${ex.nome}</button>`).join('')}
          <button class="btn-del-hist" onclick="deletarHist(${idx})">🗑 remover</button>
        </div>
      </div>
    </div>`;
  }).join('');
}
function encontrarCargaAnterior(hAtual,nomeEx) {
  const idx=historico.indexOf(hAtual);
  for(let i=idx+1;i<historico.length;i++){
    const h=historico[i]; if(h.treino!==hAtual.treino)continue;
    const ex=h.exercicios.find(e=>e.nome===nomeEx);
    if(ex){const {cargas}=normalizarCargas(ex);const m=maxCarga(cargas);if(m!==null)return m;}
  }
  return null;
}
function esc(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function setHistFiltro(k){histFiltro=k;renderHistorico();}
function toggleHistBody(i){document.getElementById(`hbody-${i}`)?.classList.toggle('open');}
async function deletarHist(i) {
  if(!confirm('Remover este registro?')) return;
  const h=historico[i]; await deletarHistoricoRemoto(h.id);
  historico.splice(i,1); localStorage.setItem('gt_historico',JSON.stringify(historico)); renderHistorico();
}

// ── GRÁFICO ──────────────────────────────────────────────────────────────────
function abrirChart(nomeEx,treinoKey) {
  const dados=[];
  for(let i=historico.length-1;i>=0;i--){
    const h=historico[i];if(h.treino!==treinoKey)continue;
    const ex=h.exercicios.find(e=>e.nome===nomeEx);
    if(ex){const {cargas}=normalizarCargas(ex);const m=maxCarga(cargas);if(m!==null)dados.push({data:h.data,kg:m,obs:ex.obs||''});}
  }
  document.getElementById('chartTitle').textContent=nomeEx;
  document.getElementById('chartSub').textContent=`Treino ${treinoKey} · ${dados.length} registro${dados.length!==1?'s':''}`;
  document.getElementById('modalChart').classList.add('open');
  if(!dados.length){document.getElementById('chartWrap').innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text3);font-size:13px">Sem registros de carga.</div>`;document.getElementById('chartTable').innerHTML='';return;}
  document.getElementById('chartWrap').innerHTML=`<canvas id="chartCanvas"></canvas>`;
  setTimeout(()=>desenharChart(dados,treinoKey),60);
  document.getElementById('chartTable').innerHTML=`<table class="chart-table"><thead><tr><th>DATA</th><th>CARGA</th><th>VARIAÇÃO</th><th>OBS</th></tr></thead><tbody>${dados.map((d,i)=>{const prev=i>0?dados[i-1].kg:null,delta=prev!==null?d.kg-prev:null,dHtml=delta===null?'—':delta>0?`<span style="color:#22c55e">▲${delta}kg</span>`:delta<0?`<span style="color:#ef4444">▼${Math.abs(delta)}kg</span>`:'—';return`<tr><td>${d.data}</td><td class="td-kg">${d.kg}kg</td><td>${dHtml}</td><td style="color:var(--text3)">${d.obs||'—'}</td></tr>`;}).join('')}</tbody></table>`;
}
function desenharChart(dados,treinoKey) {
  const canvas=document.getElementById('chartCanvas');if(!canvas)return;
  const wrap=document.getElementById('chartWrap'),W=wrap.clientWidth,H=wrap.clientHeight;
  canvas.style.width=W+'px';canvas.style.height=H+'px';canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;
  const ctx=canvas.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);
  const cor=getColor(treinoKey).color,kgs=dados.map(d=>d.kg),mn=Math.min(...kgs),mx=Math.max(...kgs),range=mx-mn||1;
  const pad={top:20,right:16,bottom:36,left:42},w=W-pad.left-pad.right,h=H-pad.top-pad.bottom;
  for(let i=0;i<=4;i++){const y=pad.top+(h/4)*i;ctx.strokeStyle='#2e2e2e';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(pad.left+w,y);ctx.stroke();ctx.fillStyle='#64748b';ctx.font='9px Courier New';ctx.textAlign='right';ctx.fillText(Math.round((mx-(range/4)*i)*10)/10+'kg',pad.left-4,y+4);}
  const pts=dados.map((d,i)=>({x:pad.left+(dados.length>1?(w/(dados.length-1))*i:w/2),y:pad.top+h-((d.kg-mn)/range)*h}));
  if(dados.length===1){ctx.beginPath();ctx.arc(pts[0].x,pts[0].y,5,0,Math.PI*2);ctx.fillStyle=cor;ctx.fill();ctx.fillStyle='#f1f5f9';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(dados[0].kg+'kg',pts[0].x,pts[0].y-12);return;}
  const grad=ctx.createLinearGradient(0,pad.top,0,pad.top+h);grad.addColorStop(0,cor+'44');grad.addColorStop(1,cor+'00');
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++){const mx2=(pts[i-1].x+pts[i].x)/2,my2=(pts[i-1].y+pts[i].y)/2;ctx.quadraticCurveTo(pts[i-1].x,pts[i-1].y,mx2,my2);}
  ctx.lineTo(pts[pts.length-1].x,pts[pts.length-1].y);ctx.lineTo(pts[pts.length-1].x,pad.top+h);ctx.lineTo(pts[0].x,pad.top+h);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++){const mx2=(pts[i-1].x+pts[i].x)/2,my2=(pts[i-1].y+pts[i].y)/2;ctx.quadraticCurveTo(pts[i-1].x,pts[i-1].y,mx2,my2);}
  ctx.lineTo(pts[pts.length-1].x,pts[pts.length-1].y);ctx.strokeStyle=cor;ctx.lineWidth=2.5;ctx.stroke();
  pts.forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fillStyle=cor;ctx.fill();ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fillStyle='#0f0f0f';ctx.fill();ctx.fillStyle='#64748b';ctx.font='9px Courier New';ctx.textAlign='center';const parts=dados[i].data.split('/');ctx.fillText(`${parts[0]}/${parts[1]}`,p.x,pad.top+h+22);});
  const lp=pts[pts.length-1];ctx.fillStyle='#f1f5f9';ctx.font='bold 11px sans-serif';ctx.textAlign=lp.x>W-50?'right':'center';ctx.fillText(dados[dados.length-1].kg+'kg',lp.x,lp.y-12);
}
function fecharChart(){document.getElementById('modalChart').classList.remove('open');}

// ── INIT ─────────────────────────────────────────────────────────────────────
carregarTreinos();
carregarHistorico();
</script>
